  let html=`<div class="rev-top">
    <div class="rev-top-t">Remessa de hoje</div>
    <div class="rev-top-s">${revisao.length} comprovante${revisao.length===1?'':'s'} · <span style="color:var(--green)">${okN} pronto${okN===1?'':'s'}</span>${pend.length?` · <span style="color:var(--yellow)">${pend.length} para conferir</span>`:''}</div>
  </div>`;

  // Uma unidade para a remessa toda: a IA quase nunca sabe de qual loja é o papel.
  const semUnit=revisao.filter(r=>!r.unit).length;
  if(semUnit){
    html+=`<div class="rev-bulk">
      <div style="font-size:12px;font-weight:700;margin-bottom:8px">${semUnit} sem unidade definida</div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:10px;line-height:1.5">O comprovante normalmente não diz de qual loja é. Escolha aqui e aplico em todos que estão sem.</div>
      <select id="rev-bulk-unit" class="rev-sel">${units.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select>
      <button class="btn-p btn-ghost" style="margin-top:8px" onclick="aplicarUnitEmTodos()">Aplicar a todos sem unidade</button>
    </div>`;
  }

  html+=`<div class="lst" style="margin-top:12px" id="rev-list">`;
  html+=revisao.map((it,i)=>revRowHTML(it,i)).join('');
  html+=`</div>`;

  html+=`<div style="margin-top:16px">
    <button class="btn-p ${pend.length?'btn-ghost':'btn-green'}" onclick="lancarRevisao()">
      ${pend.length?`Lançar ${okN} pronto${okN===1?'':'s'} (${pend.length} ficam pendentes)`:`✓ Lançar ${revisao.length} lançamento${revisao.length===1?'':'s'}`}
    </button>
    <button class="btn-p btn-ghost" onclick="pickFiles()">Adicionar mais comprovantes</button>
    <button class="btn-p btn-ghost" onclick="colarComprovante()">Colar comprovante copiado</button>
    <button class="btn-p btn-ghost" onclick="openExtrato()">Conferir extrato bancário</button>
    <button class="btn-p btn-del" onclick="descartarRevisao()">Descartar remessa</button>
  </div>`;
  el.innerHTML=html;
  hydrateImgs(el);

function revRowHTML(it,i){
  const cat=it.cat?getCat(it.cat):null;
  const pend=itemPendencias(it);
  const isIn=it.tipo==='in';
  const cor=isIn?'var(--green)':'var(--red)';
  const thumb=(it.img_key||it.img_b64)?imgTag(it,'rev-thumb')
    :`<div class="rev-thumb" style="display:flex;align-items:center;justify-content:center;color:var(--muted2)"><svg class="ic"><use href="#i-doc"/></svg></div>`;
  return `<div class="row" style="align-items:flex-start" onclick="openRevisaoItem(${i})">
    ${thumb}
    <div class="row-info">
      <div class="row-name">${esc(it.desc|| (cat?cat.label:'Sem descrição'))}</div>
      <div class="row-meta">${isIn?'Entrada':'Saída'}${cat?' · '+cat.label:''}${it.unit?' · '+getUnit(it.unit).name:''} · ${fmtDate(it.data)}</div>
      ${it.origem==='extrato'?`<div class="rev-src">do extrato</div>`:''}
      ${pend.length?`<div class="rev-badge warn"><svg class="ic ic-sm"><use href="#i-alert"/></svg>Falta: ${pend.join(', ')}</div>`:`<div class="rev-badge ok"><svg class="ic ic-sm"><use href="#i-check"/></svg>Pronto</div>`}
      ${(it.duvidas||[]).map(d=>`<div class="rev-duv">${esc(d)}</div>`).join('')}
    </div>
    <div class="row-right">
      <div class="row-val" style="color:${it.valor?cor:'var(--muted)'}">${it.valor?(isIn?'+':'−')+fmt(it.valor):'—'}</div>
      <div class="row-sub" style="color:var(--muted)">toque para ${pend.length?'preencher':'ajustar'}</div>

  it.data=document.getElementById('l-data').value||today();
  it.data_venc=(tipo==='out'?(document.getElementById('l-venc').value||null):null);
  it.unit=document.getElementById('l-unit').value||null;
  if(tipo==='in'){
    it.maq_id=document.getElementById('l-maquina').value||null;
    it.pagtype=document.getElementById('l-pagtype').value||null;
    it.comp_id=null; it.comp_novo_total=null; it.fixa_id=null;
  }else{
    const cv=document.getElementById('l-comp').value;
    if(cv==='__new'){
      const tot=parseFloat(document.getElementById('l-comp-total').value);
      if(!tot||tot<=0){ showToast('warn','Informe o valor total da despesa'); return; }
      if(it.valor&&tot<it.valor){ showToast('warn','Valor total menor que este pagamento'); return; }
      it.comp_id=null; it.comp_novo_total=tot;
    }else{
      it.comp_id=cv||null; it.comp_novo_total=null;
    }
    it.fixa_id=document.getElementById('l-fixa').value||null;
    it.maq_id=null; it.pagtype=null;
  }
  // O que ele preencheu na mão responde as dúvidas da IA.
  if(itemCompleto(it)) it.duvidas=[];
  it.falhou=false;
  save();
  closeMo('mo-lanc');
  revisaoIdx=null;
  renderRevisao();

  const prox=revisao.findIndex(r=>!itemCompleto(r));
  if(prox>=0) showToast('info',`Faltam ${revisao.filter(r=>!itemCompleto(r)).length} para conferir`);
  else showToast('ok','Tudo pronto para lançar!');
}

function descartarRevisaoItem(){
  if(revisaoIdx===null) return;
  const it=revisao[revisaoIdx];
  if(it&&it.img_key) imgDel(it.img_key);
  if(it&&it.extrato_fp) extratoVistos[it.extrato_fp]='ignorado';
  revisao.splice(revisaoIdx,1);
  save(); closeMo('mo-lanc'); revisaoIdx=null; renderRevisao();
  showToast('del','Comprovante descartado');
}

// Converte os itens prontos em lançamentos de verdade.
function lancarRevisao(){
  const prontos=revisao.filter(itemCompleto);
  if(!prontos.length){ showToast('warn','Nenhum está pronto ainda'); return; }
  prontos.forEach(it=>{
    let compId=it.comp_id||null;
    if(!compId&&it.comp_novo_total){
      const novo={id:'c'+Date.now()+Math.floor(Math.random()*10000),
        desc:it.desc||getCat(it.cat).label,valor_total:it.comp_novo_total,
        cat:it.cat,forn:it.forn,unit:it.unit,criado:today()};
      compromissos.push(novo); compId=novo.id;
    }
    const maq=it.tipo==='in'?getMaq(it.maq_id):null;
    const liq=it.tipo==='in'?calcLiquido(it.valor,it.pagtype,maq):it.valor;
    lancamentos.unshift({
      id:Date.now()+''+Math.floor(Math.random()*100000),
      tipo:it.tipo, cat:it.cat,
      val_bruto:it.tipo==='in'?it.valor:null,
      valor:it.valor, valor_liquido:liq,
      maq_id:it.tipo==='in'?it.maq_id:null,
      pagtype:it.tipo==='in'?it.pagtype:null,
      data:it.data,
      data_venc:it.tipo==='out'?(it.data_venc||null):null,
      data_rec:it.tipo==='in'?calcDataRec(it.pagtype,maq):null,
      desc:it.desc||getCat(it.cat).label,
      forn:it.forn, obs:it.obs, unit:it.unit,
      comp_id:it.tipo==='out'?compId:null,
      fixa_id:it.tipo==='out'?(it.fixa_id||null):null,
      img_key:it.img_key||null,
      extrato_fp:it.extrato_fp||null});
    // Débito do extrato agora está lançado: não perguntar de novo numa reimportação.
    if(it.extrato_fp) extratoVistos[it.extrato_fp]='lancado';
  });
  const n=prontos.length;
  revisao=revisao.filter(r=>!itemCompleto(r));
  save();
  renderRevisao();
  if(revisao.length){ showToast('ok',`${n} lançados · ${revisao.length} ainda pendentes`); }
  else { showToast('ok',`${n} lançamento(s) registrados. Dia fechado!`); setTab('home'); }
}

function descartarRevisao(){
  if(!confirm(`Descartar os ${revisao.length} comprovantes desta remessa? Eles não serão lançados.`)) return;
  revisao.forEach(r=>{
    if(r.img_key) imgDel(r.img_key);
    if(r.extrato_fp) extratoVistos[r.extrato_fp]='ignorado';
  });
  revisao=[]; save(); renderRevisao();
  showToast('del','Remessa descartada');
}

// ══════════════════════════════════════════════════
// MODAL HELPERS
// ══════════════════════════════════════════════════
function openMo(id){ document.getElementById(id).classList.add('open'); }
function closeMo(id){ document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.mo').forEach(el=>{
  el.addEventListener('click',e=>{ if(e.target===el) el.classList.remove('open'); });
});

// ══════════════════════════════════════════════════
// TOAST
// ══════════════════════════════════════════════════
let _tt;
const TOAST_IC={ok:'check',warn:'alert',erro:'x',del:'trash',info:'info',receipt:'receipt',mute:'mute'};
function showToast(tipo,txt){
  clearTimeout(_tt);
  const nome=TOAST_IC[tipo]||'info';
  document.getElementById('toast-ico').innerHTML=`<svg class="ic ic-sm"><use href="#i-${nome}"/></svg>`;
  document.getElementById('toast-txt').textContent=txt;
  document.getElementById('toast').classList.add('show');
  _tt=setTimeout(()=>document.getElementById('toast').classList.remove('show'),3200);
}
